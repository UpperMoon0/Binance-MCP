[project]
name = "binance-mcp"
version = "0.2.0"
description = "Secure MCP server for Binance public market data and authenticated account access"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NsTut" }]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "websockets>=15,<18",
  "mcp>=2,<3",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["binance_mcp*"]
